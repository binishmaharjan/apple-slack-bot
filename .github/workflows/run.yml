name: Dev News Slack Bot

on:
  schedule:
    # Runs once daily at 00:00 UTC (09:00 JST)
    - cron: '0 0 * * *'
  # Allows you to manually trigger it with a button for testing
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Restore feed state
        uses: actions/cache/restore@v4
        id: feed-state-cache
        with:
          path: state/
          key: feed-state-v3-${{ github.run_id }}
          restore-keys: |
            feed-state-v3-
            feed-state-v2-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Script
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python main.py

      - name: Save feed state
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: state/
          key: feed-state-v3-${{ github.run_id }}
